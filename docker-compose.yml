# docker-compose.yml — local dev dependencies (Postgres + Redis).
# The Judge0 stack is intentionally separate (infra/judge0/) — see Architecture §8:
# untrusted code execution is network-isolated from the rest of the system.

services:
  postgres:
    image: postgres:16-alpine
    container_name: clash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clash
      POSTGRES_PASSWORD: clash
      POSTGRES_DB: clashofcode
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clash -d clashofcode"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: clash-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
